<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600&family=Nunito:wght@600&display=swap" rel="stylesheet">
<title>ma.</title>
<meta name="theme-color" content="#f1f0ec">
<meta name="description" content="家具製作向けの木取り計算Webアプリ">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ma.">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">

<style>

:root{
  --bg:#f1f0ec;
  --surface:#ffffff;
  --surface-2:#f8f7f4;
  --surface-3:#eeece7;
  --text:#252624;
  --muted:#777870;
  --muted-2:#9a9a92;
  --line:#dddcd6;
  --line-strong:#c9c8c1;
  --sumi:#303330;
  --sumi-2:#3d403d;
  --sumi-soft:#e8e9e5;
  --wood:#e7dcc7;
  --wood-line:#827867;
  --success:#536652;
  --success-bg:#edf2eb;
  --success-line:#cad7c6;

  --sage:#6f816d;
  --sage-soft:#e9efe7;
  --blue:#677b86;
  --blue-soft:#e8eef1;
  --ochre:#a18555;
  --ochre-soft:#f1eadc;
  --clay:#9a6e62;
  --clay-soft:#f2e7e3;

  --danger:#905e56;
  --danger-bg:#f6eeee;
  --radius:16px;
  --shadow:0 8px 24px rgba(38,38,34,.055);
}

*{box-sizing:border-box}

html{
  background:var(--bg);
  -webkit-text-size-adjust:100%;
}

body{
  margin:0;
  font-family:"Nunito","Hiragino Sans","Yu Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-weight:600;
  background:
    radial-gradient(circle at top left,rgba(255,255,255,.75),transparent 28rem),
    var(--bg);
  color:var(--text);
  font-feature-settings:"palt";
}

button,input,select{
  font-family:"Nunito","Hiragino Sans","Yu Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-weight:600;
}

header{
  position:relative;
  z-index:1;
  background:transparent;
  border-bottom:0;
}

.topbar{
  max-width:1180px;
  margin:auto;
  padding:18px 18px 16px;
  display:flex;
  align-items:center;
  justify-content:center;
}

h1{
  margin:0;
}





main{
  max-width:1180px;
  margin:auto;
  padding:20px 18px 50px;
}

.card{
  background:rgba(255,255,255,.92);
  border:1px solid rgba(221,220,214,.95);
  border-radius:20px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:var(--shadow);
}

.section-title{
  display:flex;
  align-items:center;
  gap:10px;
  margin:0 0 14px;
}

.section-title>span{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:30px;
  height:22px;
  padding:0 7px;
  border-radius:999px;
  color:#fff;
  font-size:9px;
  font-weight:800;
  letter-spacing:.08em;
}
.card:nth-of-type(1) .section-title>span{background:var(--sage)}
.card:nth-of-type(2) .section-title>span{background:var(--blue)}
.card:nth-of-type(4) .section-title>span{background:var(--ochre)}

h2{
  margin:0;
  font-size:16px;
  line-height:1.2;
  font-weight:760;
  letter-spacing:.025em;
  color:var(--sumi);
}

.note{
  margin:0 0 14px;
  font-size:12px;
  color:var(--muted);
  line-height:1.7;
}

label{
  display:block;
  margin-bottom:5px;
  font-size:10px;
  line-height:1.2;
  font-weight:700;
  color:var(--muted);
  letter-spacing:.02em;
}

input,select{
  width:100%;
  min-height:42px;
  padding:9px 11px;
  border:1px solid var(--line);
  border-radius:11px;
  outline:none;
  background:var(--surface);
  color:var(--text);
  font-size:14px;
  transition:border-color .16s ease,box-shadow .16s ease,background .16s ease;
}

input:focus,select:focus{
  border-color:#999c96;
  box-shadow:0 0 0 3px rgba(48,51,48,.08);
  background:#fff;
}

select{
  appearance:auto;
}

button{
  min-height:42px;
  border:1px solid transparent;
  border-radius:11px;
  padding:9px 13px;
  font-size:13px;
  font-weight:730;
  cursor:pointer;
  transition:transform .08s ease,background .15s ease,border-color .15s ease,box-shadow .15s ease;
  -webkit-tap-highlight-color:transparent;
}

button:active{transform:scale(.985)}

.primary{
  width:100%;
  min-height:50px;
  background:var(--sumi);
  color:#fff;
  border-color:var(--sumi);
  box-shadow:0 7px 18px rgba(48,51,48,.17);
  font-size:15px;
  letter-spacing:.035em;
}

.primary:hover{background:var(--sumi-2)}

.secondary{
  background:var(--sage-soft);
  color:#455244;
  border-color:#d4ddd0;
}

.secondary:hover{
  background:#dfe8dc;
  border-color:#c6d2c2;
}

.danger{
  background:var(--danger-bg);
  color:var(--danger);
  border-color:#eadad7;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.toolbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.toolbar button{
  flex:1;
  min-width:130px;
}

/* Sheet candidates */
#sheetTypes{
  display:grid;
  gap:8px;
}

.sheet-type-row{
  display:grid;
  grid-template-columns:minmax(180px,1.45fr) minmax(110px,.75fr) minmax(110px,.75fr) minmax(140px,.9fr) auto;
  gap:9px;
  align-items:end;
  padding:11px;
  border:1px solid #ded7c9;
  border-radius:14px;
  background:linear-gradient(180deg,#fbfaf7,#f5f1e8);
}

.sheet-type-row .sheet-name{
  min-width:0;
}

.sheet-type-row input,
.sheet-type-row select{
  background:#fff;
}

.sheet-size-preview{
  min-height:42px;
  display:flex;
  align-items:center;
  padding:0 12px;
  border-radius:11px;
  background:var(--ochre-soft);
  color:#6e5b38;
  font-size:12px;
  font-weight:750;
  white-space:nowrap;
}

.sheet-mix{
  margin-top:8px;
  font-size:11px;
  line-height:1.6;
  color:var(--muted);
}

/* Spreadsheet */
.matrix-wrap{
  position:relative;
  max-height:62vh;
  overflow:auto;
  -webkit-overflow-scrolling:touch;
  border:1px solid var(--line-strong);
  border-radius:15px;
  background:#fff;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.65);
}

.matrix{
  border-collapse:separate;
  border-spacing:0;
  min-width:760px;
  width:max-content;
}

.matrix th,.matrix td{
  padding:8px;
  vertical-align:top;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
}

.matrix th:last-child,.matrix td:last-child{border-right:0}
.matrix tr:last-child td{border-bottom:0}

.matrix thead th{
  position:sticky;
  top:0;
  z-index:20;
  background:var(--blue-soft);
  box-shadow:0 1px 0 var(--line-strong);
}

.matrix .part-head{
  position:sticky;
  top:0;
  left:0;
  z-index:30;
  width:142px;
  min-width:142px;
  background:var(--sumi);
  color:#fff;
  text-align:left;
  box-shadow:1px 1px 0 rgba(0,0,0,.08);
  font-size:12px;
  letter-spacing:.03em;
}

.matrix .part-name{
  position:sticky;
  left:0;
  z-index:15;
  width:142px;
  min-width:142px;
  background:#f1f4f3;
  box-shadow:1px 0 0 var(--line-strong);
}

.drawing-head{
  position:sticky;
  top:0;
  z-index:21;
  width:196px;
  min-width:196px;
  background:var(--blue-soft);
}

.drawing-title{
  display:flex;
  gap:6px;
  align-items:center;
}

.drawing-title input{
  min-height:38px;
  font-weight:760;
  background:#f8f8f5;
}

.cell{
  width:196px;
  min-width:196px;
  background:#fff;
}

.cell:hover{background:#fdfcf9}

.cell-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}

.cell-grid .qty{grid-column:1/2}
.cell-grid .rotate{grid-column:2/3}

.cell input,.cell select{
  min-height:36px;
  padding:7px 8px;
  font-size:12px;
}

.cell label{
  margin-bottom:4px;
  font-size:8px;
  letter-spacing:.03em;
  color:var(--muted-2);
}

.part-name-wrap{
  display:grid;
  grid-template-columns:1fr 46px;
  gap:5px;
}

.part-name-wrap select,
.part-name-wrap input{
  min-height:38px;
  font-size:12px;
  font-weight:760;
  background:#fff;
}

.row-controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  margin-top:7px;
}

.row-controls button,
.row-delete,
.row-add-below{
  min-height:30px;
  padding:5px 6px;
  font-size:10px;
  border-radius:8px;
}

.row-delete{
  width:100%;
  margin-top:5px;
}

.row-add-below{
  width:100%;
  margin-top:5px;
  background:var(--blue-soft);
  color:#4e626b;
  border-color:#d1dde2;
}

/* Sticky calculate */
.calc-sticky{
  position:sticky;
  bottom:10px;
  z-index:12;
  padding:7px;
  border:1px solid rgba(218,217,211,.8);
  border-radius:17px;
  background:rgba(244,243,239,.88);
  backdrop-filter:blur(16px);
  box-shadow:0 8px 24px rgba(38,38,34,.09);
}

/* Results */
.result-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.share-btn{
  min-height:38px;
  padding:8px 13px;
  background:#fff;
  color:var(--sumi);
  border-color:var(--line-strong);
}

.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.stat{
  min-height:84px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--surface-2);
}
.stat:nth-child(1){background:var(--blue-soft);border-color:#d1dde2}
.stat:nth-child(2){background:var(--sage-soft);border-color:#d3ded0}
.stat:nth-child(3){background:var(--ochre-soft);border-color:#e3d8c3}

.stat b{
  display:block;
  font-size:23px;
  line-height:1;
  font-weight:780;
  letter-spacing:-.02em;
  color:var(--sumi);
}

.stat span{
  margin-top:7px;
  font-size:9px;
  font-weight:700;
  letter-spacing:.04em;
  color:var(--muted);
}

.recommend{
  margin-top:12px;
  padding:14px 15px;
  border:1px solid var(--success-line);
  border-radius:14px;
  background:linear-gradient(180deg,#edf3ea,#e8efe5);
  font-size:12px;
  line-height:1.7;
  color:#445043;
}

.recommend b{
  color:#354534;
  font-size:17px;
  font-weight:800;
}

.compare-table{
  width:100%;
  margin-top:10px;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:12px;
  border-collapse:separate;
  border-spacing:0;
  background:#fff;
  font-size:11px;
}

.compare-table th,
.compare-table td{
  padding:9px 8px;
  border-bottom:1px solid var(--line);
  text-align:right;
}

.compare-table th:first-child,
.compare-table td:first-child{text-align:left}

.compare-table th{
  background:var(--surface-3);
  color:var(--muted);
  font-weight:750;
}

.sheet-wrap{
  margin-top:18px;
  padding-top:2px;
}

.sheet-title{
  display:flex;
  align-items:center;
  min-height:28px;
  margin:0 0 7px;
  color:var(--sumi);
  font-size:12px;
  font-weight:780;
  letter-spacing:.015em;
}

.sheet{
  position:relative;
  width:100%;
  overflow:hidden;
  border:1px solid var(--wood-line);
  border-radius:10px;
  background:
    linear-gradient(rgba(255,255,255,.12),rgba(255,255,255,.12)),
    var(--wood);
  box-shadow:0 4px 12px rgba(75,68,57,.07);
}

.piece{
  position:absolute;
  overflow:hidden;
  padding:5px;
  border:1px solid #676359;
  border-radius:4px;
  background:rgba(255,255,255,.9);
  color:#393a36;
  font-size:9px;
  line-height:1.35;
}

.piece strong{
  display:block;
  margin-bottom:2px;
  font-size:9px;
  font-weight:800;
}

#result.note{
  color:var(--muted-2);
}

.color-note{
  margin-top:8px;
  font-size:10px;
  color:var(--muted-2);
}
#shareCanvas{display:none}

@media(max-width:760px){
  main{padding:13px 10px 44px}
  .topbar{padding:13px 12px 11px}
  .card{padding:14px;border-radius:17px}
  .sheet-type-row{
    grid-template-columns:1fr 1fr;
  }
  .sheet-type-row .sheet-name{
    grid-column:1/-1;
  }
  .sheet-type-row .sheet-size-preview{
    grid-column:1/-1;
  }
  .sheet-type-row>button{
    grid-column:1/-1;
  }
}

@media(max-width:520px){
  .grid{grid-template-columns:1fr 1fr}
  .toolbar button{min-width:calc(50% - 4px)}
  .toolbar button:last-child:nth-child(odd){flex-basis:100%}
  .summary{gap:6px}
  .stat{min-height:74px}
  .stat b{font-size:20px}
  .matrix .part-head,
  .matrix .part-name{
    width:130px;
    min-width:130px;
  }
  .drawing-head,.cell{
    width:182px;
    min-width:182px;
  }
}


.matrix-mobile-nav{
  display:none;
}

@media(max-width:520px){
  main{
    padding-left:10px;
    padding-right:10px;
  }

  .card{
    padding:12px;
  }

  .matrix-wrap{
    width:100%;
    max-width:100%;
    min-width:0;
    overflow-x:scroll;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior-x:contain;
    touch-action:pan-x pan-y;
    scroll-behavior:smooth;
  }

  .matrix{
    min-width:max-content;
  }

  .matrix .part-head,
  .matrix .part-name{
    width:96px;
    min-width:96px;
    max-width:96px;
  }

  .drawing-head,
  .cell{
    width:172px;
    min-width:172px;
  }

  .part-name-wrap{
    grid-template-columns:1fr;
  }

  .part-name-wrap input{
    width:100%;
  }

  .row-controls{
    grid-template-columns:1fr;
  }

  .matrix-mobile-nav{
    display:grid;
    grid-template-columns:auto 1fr auto;
    align-items:center;
    gap:6px;
    margin:0 0 8px;
  }

  .matrix-mobile-nav button{
    min-height:34px;
    padding:6px 8px;
    font-size:10px;
    white-space:nowrap;
  }

  .matrix-mobile-nav span{
    text-align:center;
    font-size:9px;
    color:var(--muted);
    line-height:1.25;
  }
}

@media print{
  @page{size:A4 landscape;margin:8mm}
  body{background:#fff}
  header,.calc-sticky,#shareResult,#addDrawing,#addPart,
  .toolbar,.danger,.note,#recommendation,#comparison{display:none !important}
  main{padding:0;max-width:none}
  .card{border:0;padding:0;margin:0;box-shadow:none}
  section.card:not(:last-of-type){display:none}
  .result-header{display:block}
  .summary{margin:0 0 8mm}
  #result{padding:0 !important}
  .sheet-wrap{break-inside:avoid;page-break-inside:avoid;margin:0 0 8mm}
  .sheet{border:1px solid #444;box-shadow:none}
  .piece{background:#fff !important}
}


.drawing-head,
.cell{
  transition:background .15s ease;
}
.drawing-color-bar{
  height:4px;
  border-radius:999px;
  margin-bottom:6px;
}


.logo-only{
  min-height:92px;
  padding:22px 18px 18px;
}



@media(max-width:520px){
  .logo-only{
    min-height:76px;
    padding:16px 12px 14px;
  }
  
}




@media(max-width:520px){
  .logo-only{
    min-height:80px;
    padding:18px 12px 14px;
  }
  
}


.ma-logo{
  display:flex;
  align-items:baseline;
  justify-content:center;
  color:#2d2f2d;
  font-family:"Comfortaa",sans-serif;
  font-weight:600;
  font-size:78px;
  line-height:.9;
  letter-spacing:-0.02em;
  white-space:nowrap;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

@media(max-width:520px){
  .logo-only{
    min-height:80px;
    padding:18px 12px 14px;
  }
  .ma-logo{
    font-size:70px;
  }
}


/* PWA / iPhone standalone */
body{
  min-height:100svh;
  padding-bottom:env(safe-area-inset-bottom);
}
.app-header{
  padding-top:env(safe-area-inset-top);
}
button,
input,
select{
  touch-action:manipulation;
}
@media (display-mode:standalone){
  body{
    overscroll-behavior-y:none;
  }
}

</style>
</head>
<body>
<header class="app-header">
  <div class="topbar logo-only">
    <div class="ma-logo" aria-label="ma.">ma.</div>
  </div>
</header>
<main>

<section class="card">
  <div class="section-title"><span>01</span><h2>原板サイズ</h2></div>
  <p class="note">使う可能性のある原板サイズを登録してください。単独使用と複合使用を自動比較します。貼りしろは仕上寸法に対する追加寸法の合計で入力します。長さ・幅それぞれにその数値を加えて木取りします。</p>
  <div id="sheetTypes"></div>
  <div class="toolbar" style="margin-top:10px">
    <button class="secondary" id="addSheetType">＋ 原板を追加</button>
    <button class="secondary" id="sheetPresetSample">定番をセット</button>
  </div>

  <div class="grid" style="margin-top:12px">
    <div>
      <label>切りしろ mm</label>
      <input id="kerf" type="number" value="3">
    </div>
    <div>
      <label>端落とし mm</label>
      <input id="margin" type="number" value="10">
    </div>
    <div>
      <label>貼りしろ mm / 全体</label>
      <input id="pasteAllowance" type="number" min="0" value="0">
    </div>
  </div>
</section>

<section class="card">
  <div class="section-title"><span>02</span><h2>部材表</h2></div>
  <p class="note">横に図面番号、縦に部材名。図面番号の順番は固定し、部材名は上下に並べ替えできます。各行の「＋ 下に追加」で途中にも部材を差し込めます。</p>
  <div class="matrix-mobile-nav" aria-label="図面列の移動">
    <button type="button" class="secondary" id="matrixPrev">← 前の図面</button>
    <span>横にスワイプできます</span>
    <button type="button" class="secondary" id="matrixNext">次の図面 →</button>
  </div>
  <div class="matrix-wrap" id="matrixWrap">
    <table class="matrix" id="matrix">
      <thead>
        <tr id="drawingHeader">
          <th class="part-head">部材名</th>
        </tr>
      </thead>
      <tbody id="matrixBody"></tbody>
    </table>
  </div>
  <div class="toolbar" style="margin-top:10px">
    <button class="secondary" id="addDrawing">＋ 図面番号</button>
    <button class="secondary" id="addPart">＋ 部材</button>
  </div>
</section>

<section class="card calc-sticky">
  <button class="primary" id="calc">木取り計算</button>
</section>

<section class="card">
  <div class="result-header">
    <div class="section-title" style="margin:0"><span>03</span><h2>結果</h2></div>
    <button id="shareResult" class="share-btn">PDFを共有</button>
  </div>
  <div class="summary" style="margin-top:12px">
    <div class="stat"><b id="sheetCount">-</b><span>原板枚数</span></div>
    <div class="stat"><b id="yieldRate">-</b><span>歩留まり</span></div>
    <div class="stat"><b id="pieceCount">-</b><span>部材数</span></div>
  </div>
  <div id="recommendation"></div><div class="color-note">図面番号ごとに同じ色を使います。貼りしろ設定時は、木取り図に「仕上寸法 / 木取寸法」を表示します。</div>
  <div id="comparison"></div>
  <div id="result" class="note" style="text-align:center;padding:18px">まだ計算していません</div>
</section>

<canvas id="shareCanvas"></canvas>
</main>

<script>
const headerEl = document.getElementById('drawingHeader');
const bodyEl = document.getElementById('matrixBody');
const matrixWrapEl = document.getElementById('matrixWrap');
const matrixPrevEl = document.getElementById('matrixPrev');
const matrixNextEl = document.getElementById('matrixNext');

function scrollMatrixByDrawing(direction){
  if(!matrixWrapEl) return;
  const stickyPart = window.matchMedia('(max-width:520px)').matches ? 96 : 142;
  const drawingWidth = window.matchMedia('(max-width:520px)').matches ? 172 : 196;
  const current = matrixWrapEl.scrollLeft;
  let target;
  if(direction > 0){
    target = Math.max(stickyPart, current + drawingWidth);
  }else{
    target = Math.max(0, current - drawingWidth);
  }
  matrixWrapEl.scrollTo({left:target, behavior:'smooth'});
}
matrixPrevEl?.addEventListener('click',()=>scrollMatrixByDrawing(-1));
matrixNextEl?.addEventListener('click',()=>scrollMatrixByDrawing(1));
const resultEl = document.getElementById('result');

let sheetTypes = [];


const SHEET_PRESETS = [
  {value:'1820x910', label:'3×6　1820 × 910', name:'3×6', w:1820, h:910},
  {value:'2430x1220', label:'4×8　2430 × 1220', name:'4×8', w:2430, h:1220},
  {value:'2430x910', label:'3×8　2430 × 910', name:'3×8', w:2430, h:910},
  {value:'1820x1220', label:'4×6　1820 × 1220', name:'4×6', w:1820, h:1220},
  {value:'3050x1220', label:'4×10　3050 × 1220', name:'4×10', w:3050, h:1220},
  {value:'custom', label:'カスタム', name:'', w:'', h:''}
];

function addSheetType(preset='custom', name='', w='', h=''){
  if(preset !== 'custom'){
    const p=SHEET_PRESETS.find(x=>x.value===preset);
    if(p){ name=p.name; w=p.w; h=p.h; }
  }
  sheetTypes.push({id:uid(),preset,name,w,h});
  renderSheetTypes();
}
function deleteSheetType(id){
  if(sheetTypes.length<=1){ alert('原板サイズは1つ以上必要です'); return; }
  sheetTypes = sheetTypes.filter(s=>s.id!==id);
  renderSheetTypes();
}
function applySheetPreset(id,value){
  const s=sheetTypes.find(x=>x.id===id);
  if(!s)return;
  s.preset=value;
  if(value!=='custom'){
    const p=SHEET_PRESETS.find(x=>x.value===value);
    if(p){ s.name=p.name; s.w=p.w; s.h=p.h; }
  }
  renderSheetTypes();
}
function renderSheetTypes(){
  const box=document.getElementById('sheetTypes');
  box.innerHTML='';
  sheetTypes.forEach(s=>{
    if(!s.preset){
      const matched=SHEET_PRESETS.find(p=>p.value!=='custom' && Number(s.w)===p.w && Number(s.h)===p.h);
      s.preset=matched?matched.value:'custom';
    }

    const row=document.createElement('div');
    row.className='sheet-type-row';
    const isCustom=s.preset==='custom';

    row.innerHTML=`
      <div class="sheet-name">
        <label>原板サイズ</label>
        <select data-sheet-preset="${s.id}">
          ${SHEET_PRESETS.map(p=>`<option value="${p.value}" ${p.value===s.preset?'selected':''}>${p.label}</option>`).join('')}
        </select>
      </div>
      ${isCustom ? `
      <div><label>長さ mm</label><input type="number" data-sheet-w="${s.id}" value="${s.w||''}" placeholder=""></div>
      <div><label>幅 mm</label><input type="number" data-sheet-h="${s.id}" value="${s.h||''}" placeholder=""></div>
      <div class="sheet-size-preview">${s.w && s.h ? `${s.w} × ${s.h} mm` : '寸法を入力'}</div>
      ` : `
      <div class="sheet-size-preview">${s.w} × ${s.h} mm</div>
      `}
      <button class="danger" data-del-sheet="${s.id}">削除</button>`;

    box.appendChild(row);
  });

  document.querySelectorAll('[data-sheet-preset]').forEach(el=>el.onchange=()=>{
    applySheetPreset(el.dataset.sheetPreset,el.value);
  });
  document.querySelectorAll('[data-sheet-w]').forEach(el=>el.oninput=()=>{
    const s=sheetTypes.find(x=>x.id===el.dataset.sheetW); if(s)s.w=el.value;
  });
  document.querySelectorAll('[data-sheet-h]').forEach(el=>el.oninput=()=>{
    const s=sheetTypes.find(x=>x.id===el.dataset.sheetH); if(s)s.h=el.value;
  });
  document.querySelectorAll('[data-del-sheet]').forEach(el=>el.onclick=()=>deleteSheetType(el.dataset.delSheet));
}
function getValidSheetTypes(){
  return sheetTypes.map(s=>({
    ...s,w:Number(s.w),h:Number(s.h),
    label:(s.preset==='custom' ? `${s.w}×${s.h}` : (s.name||`${s.w}×${s.h}`)).trim()
  })).filter(s=>s.w>0&&s.h>0);
}

let drawings = [];
let parts = [];

function uid(){ return Math.random().toString(36).slice(2,9); }

function addDrawing(name=''){
  const id = uid();
  drawings.push({id,name});
  parts.forEach(p => p.cells[id] = {w:'',h:'',qty:'',rotate:false});
  renderMatrix();
}
function addPart(name='', insertIndex=null){
  const id = uid();
  const cells = {};
  drawings.forEach(d => cells[d.id] = {w:'',h:'',qty:'',rotate:false});
  const item = {id,name,baseName:name,suffix:'',cells};
  if(insertIndex === null || insertIndex < 0 || insertIndex > parts.length){
    parts.push(item);
  }else{
    parts.splice(insertIndex,0,item);
  }
  renderMatrix();
}
function deleteDrawing(id){
  if(drawings.length<=1){ alert('図面番号は1列以上必要です'); return; }
  drawings = drawings.filter(d=>d.id!==id);
  parts.forEach(p=>delete p.cells[id]);
  renderMatrix();
}
function deletePart(id){
  if(parts.length<=1){ alert('部材名は1行以上必要です'); return; }
  parts = parts.filter(p=>p.id!==id);
  renderMatrix();
}

function movePart(id, direction){
  const index = parts.findIndex(p=>p.id===id);
  if(index<0)return;
  const target = index + direction;
  if(target<0 || target>=parts.length)return;
  [parts[index],parts[target]]=[parts[target],parts[index]];
  renderMatrix();
}
function addPartBelow(id){
  const index = parts.findIndex(p=>p.id===id);
  addPart('', index<0 ? null : index+1);
}

function renderMatrix(){
  headerEl.innerHTML = '<th class="part-head">部材名</th>';
  drawings.forEach(d=>{
    const th = document.createElement('th');
    th.className='drawing-head';
    const dc = pieceColorFor(d.name || d.id);
    th.style.background = hexToRgba(dc.bg, .92);
    th.innerHTML = `
      <div class="drawing-color-bar" style="background:${dc.border}"></div>
      <div class="drawing-title">
        <input value="${escapeHtml(d.name)}" data-drawing-name="${d.id}" placeholder="図面番号" style="border-color:${dc.border}">
        <button class="danger" data-del-drawing="${d.id}" style="padding:7px 8px">×</button>
      </div>`;
    headerEl.appendChild(th);
  });

  bodyEl.innerHTML='';
  parts.forEach(p=>{
    const tr=document.createElement('tr');

    const nameTd=document.createElement('td');
    nameTd.className='part-name';
    const baseName = p.baseName || p.name || '';
    const suffix = p.suffix || '';
    const options = ['','天板','中天板','地板','中地板','側板','束','固定棚','可動棚','扉','前板','背板','その他'];
    nameTd.innerHTML = `
      <div class="part-name-wrap">
        <select data-part-base="${p.id}">
          ${options.map(o=>`<option value="${o}" ${o===baseName?'selected':''}>${o || '選択'}</option>`).join('')}
        </select>
        <input maxlength="2" value="${escapeHtml(suffix)}" data-part-suffix="${p.id}" placeholder="A">
      </div>
      <div class="row-controls">
        <button class="secondary" data-move-up="${p.id}">↑ 上へ</button>
        <button class="secondary" data-move-down="${p.id}">↓ 下へ</button>
      </div>
      <button class="danger row-delete" data-del-part="${p.id}">削除</button>
      <button class="secondary row-add-below" data-add-below="${p.id}">＋ 下に追加</button>`;
    tr.appendChild(nameTd);

    drawings.forEach(d=>{
      const c=p.cells[d.id] || (p.cells[d.id]={w:'',h:'',qty:'',rotate:false});
      const td=document.createElement('td');
      td.className='cell';
      const dc = pieceColorFor(d.name || d.id);
      td.style.background = hexToRgba(dc.bg, .45);
      td.innerHTML=`
        <div class="cell-grid">
          <div><label>長さ</label><input type="number" value="${c.w}" data-cell="${p.id}|${d.id}|w" style="border-color:${hexToRgba(dc.border,.6)}"></div>
          <div><label>幅</label><input type="number" value="${c.h}" data-cell="${p.id}|${d.id}|h" style="border-color:${hexToRgba(dc.border,.6)}"></div>
          <div class="qty"><label>枚数</label><input type="number" min="0" value="${c.qty}" data-cell="${p.id}|${d.id}|qty" style="border-color:${hexToRgba(dc.border,.6)}"></div>
          <div class="rotate"><label>回転</label>
            <select data-cell="${p.id}|${d.id}|rotate" style="border-color:${hexToRgba(dc.border,.6)}">
              <option value="1" ${c.rotate?'selected':''}>可</option>
              <option value="0" ${!c.rotate?'selected':''}>不可</option>
            </select>
          </div>
        </div>`;
      tr.appendChild(td);
    });
    bodyEl.appendChild(tr);
  });

  bindMatrix();
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function bindMatrix(){
  document.querySelectorAll('[data-drawing-name]').forEach(el=>{
    el.oninput=()=>{const d=drawings.find(x=>x.id===el.dataset.drawingName); if(d)d.name=el.value;}
  });
  document.querySelectorAll('[data-part-base]').forEach(el=>{
    el.onchange=()=>{
      const p=parts.find(x=>x.id===el.dataset.partBase);
      if(p){ p.baseName=el.value; p.name=(p.baseName||'')+(p.suffix||''); }
    }
  });
  document.querySelectorAll('[data-part-suffix]').forEach(el=>{
    el.oninput=()=>{
      const p=parts.find(x=>x.id===el.dataset.partSuffix);
      if(p){
        p.suffix=(el.value||'').toUpperCase();
        el.value=p.suffix;
        p.name=(p.baseName||'')+(p.suffix||'');
      }
    }
  });
  document.querySelectorAll('[data-cell]').forEach(el=>{
    el.oninput=el.onchange=()=>{
      const [pid,did,key]=el.dataset.cell.split('|');
      const p=parts.find(x=>x.id===pid); if(!p)return;
      if(!p.cells[did])p.cells[did]={w:'',h:'',qty:'',rotate:false};
      p.cells[did][key]= key==='rotate' ? el.value==='1' : el.value;
    };
  });
  document.querySelectorAll('[data-del-drawing]').forEach(el=>el.onclick=()=>deleteDrawing(el.dataset.delDrawing));
  document.querySelectorAll('[data-del-part]').forEach(el=>el.onclick=()=>deletePart(el.dataset.delPart));
  document.querySelectorAll('[data-move-up]').forEach(el=>el.onclick=()=>movePart(el.dataset.moveUp,-1));
  document.querySelectorAll('[data-move-down]').forEach(el=>el.onclick=()=>movePart(el.dataset.moveDown,1));
  document.querySelectorAll('[data-add-below]').forEach(el=>el.onclick=()=>addPartBelow(el.dataset.addBelow));
}

function getPieces(){
  const pieces=[];
  const allowance=Math.max(0,Number(document.getElementById('pasteAllowance')?.value||0));

  parts.forEach(p=>{
    drawings.forEach(d=>{
      const c=p.cells[d.id];
      if(!c)return;

      const finishW=Number(c.w);
      const finishH=Number(c.h);
      const qty=Number(c.qty||0);

      if(finishW>0 && finishH>0 && qty>0){
        const cutW=finishW + allowance;
        const cutH=finishH + allowance;

        for(let i=0;i<qty;i++){
          pieces.push({
            drawing:d.name.trim(),
            name:((p.baseName||p.name||'')+(p.suffix||'')).trim(),
            finishW,
            finishH,
            allowance,
            w:cutW,
            h:cutH,
            rotate:!!c.rotate
          });
        }
      }
    });
  });

  return pieces.sort((a,b)=>(b.w*b.h)-(a.w*a.h));
}

function packPieces(pieces, sheetW, sheetH, kerf, margin){
  const innerW=sheetW-margin*2, innerH=sheetH-margin*2;
  if(innerW<=0||innerH<=0)throw new Error('端落としが大きすぎます');
  const sheets=[];

  function tryPlace(sheet,piece){
    const variants=[{w:piece.w,h:piece.h,rotated:false}];
    if(piece.rotate && piece.w!==piece.h)variants.push({w:piece.h,h:piece.w,rotated:true});

    for(const v of variants){
      for(const row of sheet.rows){
        if(v.h<=row.height && row.xNext+v.w<=margin+innerW){
          const placed={...piece,...v,x:row.xNext,y:row.y};
          row.items.push(placed);
          row.xNext+=v.w+kerf;
          sheet.items.push(placed);
          return true;
        }
      }
      const usedH=sheet.rows.length?Math.max(...sheet.rows.map(r=>r.y+r.height)):margin;
      const y=sheet.rows.length?usedH+kerf:margin;
      if(v.w<=innerW && y+v.h<=margin+innerH){
        const row={y,height:v.h,xNext:margin+v.w+kerf,items:[]};
        const placed={...piece,...v,x:margin,y};
        row.items.push(placed);sheet.rows.push(row);sheet.items.push(placed);
        return true;
      }
    }
    return false;
  }

  for(const piece of pieces){
    let placed=false;
    for(const sheet of sheets){
      if(tryPlace(sheet,piece)){placed=true;break;}
    }
    if(!placed){
      const s={rows:[],items:[]};
      if(!tryPlace(s,piece))throw new Error(`${piece.drawing} ${piece.name} ${piece.w}×${piece.h} が原板に入りません`);
      sheets.push(s);
    }
  }
  return sheets;
}





function canFitEmpty(piece,type,margin){
  const iw=type.w-margin*2, ih=type.h-margin*2;
  if(piece.w<=iw && piece.h<=ih)return true;
  if(piece.rotate && piece.h<=iw && piece.w<=ih)return true;
  return false;
}

function getPieceVariants(piece){
  const out=[{w:piece.w,h:piece.h,rotated:false}];
  if(piece.rotate && piece.w!==piece.h){
    out.push({w:piece.h,h:piece.w,rotated:true});
  }
  return out;
}

function makeFixedSheets(types,counts,margin){
  const sheets=[];
  counts.forEach((count,i)=>{
    const t=types[i];
    for(let n=0;n<count;n++){
      sheets.push({
        sheetTypeId:t.id,
        label:t.label,
        sheetW:t.w,
        sheetH:t.h,
        items:[],
        freeRects:[{
          x:margin,
          y:margin,
          w:t.w-margin*2,
          h:t.h-margin*2
        }]
      });
    }
  });
  return sheets;
}

function rectsIntersect(a,b){
  return !(b.x>=a.x+a.w || b.x+b.w<=a.x || b.y>=a.y+a.h || b.y+b.h<=a.y);
}

function containsRect(a,b){
  return b.x>=a.x && b.y>=a.y &&
         b.x+b.w<=a.x+a.w &&
         b.y+b.h<=a.y+a.h;
}

function pruneFreeRects(rects){
  const out=[];
  for(let i=0;i<rects.length;i++){
    if(rects[i].w<=0 || rects[i].h<=0)continue;
    let contained=false;
    for(let j=0;j<rects.length;j++){
      if(i!==j && containsRect(rects[j],rects[i])){
        contained=true;break;
      }
    }
    if(!contained)out.push(rects[i]);
  }
  return out;
}

function splitFreeRects(freeRects,used,kerf){
  const next=[];

  for(const f of freeRects){
    if(!rectsIntersect(f,used)){
      next.push(f);
      continue;
    }

    const ux1=used.x;
    const uy1=used.y;
    const ux2=used.x+used.w;
    const uy2=used.y+used.h;
    const fx1=f.x;
    const fy1=f.y;
    const fx2=f.x+f.w;
    const fy2=f.y+f.h;

    // left
    if(ux1>fx1){
      next.push({x:fx1,y:fy1,w:ux1-fx1-kerf,h:f.h});
    }
    // right
    if(ux2<fx2){
      next.push({x:ux2+kerf,y:fy1,w:fx2-ux2-kerf,h:f.h});
    }
    // top
    if(uy1>fy1){
      next.push({x:fx1,y:fy1,w:f.w,h:uy1-fy1-kerf});
    }
    // bottom
    if(uy2<fy2){
      next.push({x:fx1,y:uy2+kerf,w:f.w,h:fy2-uy2-kerf});
    }
  }

  return pruneFreeRects(next);
}

function findBestPlacement(sheets,piece){
  let best=null;

  for(let si=0;si<sheets.length;si++){
    const s=sheets[si];

    for(let fi=0;fi<s.freeRects.length;fi++){
      const f=s.freeRects[fi];

      for(const v of getPieceVariants(piece)){
        if(v.w>f.w || v.h>f.h)continue;

        const areaWaste=f.w*f.h-v.w*v.h;
        const shortWaste=Math.min(f.w-v.w,f.h-v.h);
        const longWaste=Math.max(f.w-v.w,f.h-v.h);

        // 既に使っている原板を少し優先する
        const emptyPenalty=s.items.length===0 ? 250000 : 0;
        const score=areaWaste + shortWaste*100 + longWaste + emptyPenalty;

        if(!best || score<best.score){
          best={
            si,fi,
            x:f.x,y:f.y,
            w:v.w,h:v.h,
            rotated:v.rotated,
            score
          };
        }
      }
    }
  }

  return best;
}

function packFixedFast(pieces,types,counts,kerf,margin,orderMode){
  const sheets=makeFixedSheets(types,counts,margin);

  let ordered=[...pieces];
  if(orderMode===0) ordered.sort((a,b)=>(b.w*b.h)-(a.w*a.h));
  if(orderMode===1) ordered.sort((a,b)=>Math.max(b.w,b.h)-Math.max(a.w,a.h));
  if(orderMode===2) ordered.sort((a,b)=>b.w-a.w || b.h-a.h);
  if(orderMode===3) ordered.sort((a,b)=>b.h-a.h || b.w-a.w);
  if(orderMode===4) ordered.sort((a,b)=>{
    const dg=(a.drawing||'').localeCompare(b.drawing||'');
    return dg || (b.w*b.h)-(a.w*a.h);
  });

  for(const piece of ordered){
    const pos=findBestPlacement(sheets,piece);
    if(!pos)return null;

    const s=sheets[pos.si];
    const placed={
      ...piece,
      x:pos.x,y:pos.y,
      w:pos.w,h:pos.h,
      rotated:pos.rotated
    };

    s.items.push(placed);
    s.freeRects=splitFreeRects(s.freeRects,{
      x:pos.x,y:pos.y,w:pos.w,h:pos.h
    },kerf);
  }

  return sheets;
}

function evaluateMixedSolution(sheets,pieces){
  const usedSheets=sheets.filter(s=>s.items.length>0);
  const usedArea=pieces.reduce((a,p)=>a+p.w*p.h,0);
  const totalSheetArea=usedSheets.reduce((a,s)=>a+s.sheetW*s.sheetH,0);
  const yieldRate=usedArea/totalSheetArea*100;
  const counts={};

  usedSheets.forEach(s=>{
    counts[s.label]=(counts[s.label]||0)+1;
  });

  return {
    sheets:usedSheets,
    usedArea,
    totalSheetArea,
    yieldRate,
    sheetCount:usedSheets.length,
    counts
  };
}

function generateCountCombos(typeCount,maxSheets){
  const out=[];
  const counts=new Array(typeCount).fill(0);

  function rec(i,remaining){
    if(i===typeCount-1){
      counts[i]=remaining;
      out.push([...counts]);
      return;
    }
    for(let n=0;n<=remaining;n++){
      counts[i]=n;
      rec(i+1,remaining-n);
    }
  }

  for(let total=1;total<=maxSheets;total++){
    rec(0,total);
  }
  return out;
}

function findBestSheetMix(pieces,types,kerf,margin){
  if(!types.length)throw new Error('原板サイズを1つ以上入力してください');

  for(const piece of pieces){
    if(!types.some(t=>canFitEmpty(piece,t,margin))){
      throw new Error(`${piece.drawing} ${piece.name} の木取寸法 ${piece.w}×${piece.h} が登録原板に入りません`);
    }
  }

  const usedArea=pieces.reduce((a,p)=>a+p.w*p.h,0);
  const smallestArea=Math.min(...types.map(t=>t.w*t.h));
  const largestArea=Math.max(...types.map(t=>t.w*t.h));

  const lowerBound=Math.max(1,Math.ceil(usedArea/largestArea));
  const maxSheets=Math.min(
    12,
    Math.max(lowerBound+4,Math.ceil(usedArea/smallestArea)+2)
  );

  const combos=generateCountCombos(types.length,maxSheets);

  combos.sort((a,b)=>{
    const aa=a.reduce((sum,n,i)=>sum+n*types[i].w*types[i].h,0);
    const bb=b.reduce((sum,n,i)=>sum+n*types[i].w*types[i].h,0);
    return aa-bb ||
      a.reduce((x,y)=>x+y,0)-b.reduce((x,y)=>x+y,0);
  });

  let best=null;
  let checked=0;
  const MAX_COMBOS=900;

  for(const counts of combos){
    checked++;
    if(checked>MAX_COMBOS)break;

    const rawArea=counts.reduce(
      (sum,n,i)=>sum+n*types[i].w*types[i].h,0
    );

    if(rawArea<usedArea)continue;
    if(best && rawArea>best.totalSheetArea)break;

    let comboBest=null;

    for(let mode=0;mode<5;mode++){
      const packed=packFixedFast(
        pieces,types,counts,kerf,margin,mode
      );
      if(!packed)continue;

      const sol=evaluateMixedSolution(packed,pieces);

      if(
        !comboBest ||
        sol.totalSheetArea<comboBest.totalSheetArea ||
        (
          sol.totalSheetArea===comboBest.totalSheetArea &&
          sol.sheetCount<comboBest.sheetCount
        )
      ){
        comboBest=sol;
      }
    }

    if(!comboBest)continue;

    if(
      !best ||
      comboBest.totalSheetArea<best.totalSheetArea ||
      (
        comboBest.totalSheetArea===best.totalSheetArea &&
        comboBest.yieldRate>best.yieldRate
      ) ||
      (
        comboBest.totalSheetArea===best.totalSheetArea &&
        comboBest.yieldRate===best.yieldRate &&
        comboBest.sheetCount<best.sheetCount
      )
    ){
      best=comboBest;
    }
  }

  if(!best){
    throw new Error('登録した原板サイズでは木取りできません');
  }

  return best;
}

function renderComparison(best){
  const rec=document.getElementById('recommendation');
  const cmp=document.getElementById('comparison');
  const mixText=Object.entries(best.counts).map(([k,v])=>`${k} × ${v}枚`).join(' ＋ ');
  rec.innerHTML=`<div class="recommend">
    おすすめ：<b>${mixText}</b><br>
    合計 ${best.sheetCount}枚・歩留まり ${best.yieldRate.toFixed(1)}%
    <div class="sheet-mix">貼りしろ込みの木取寸法で、登録原板の単独・混在を高速比較し、総原板面積が小さい組み合わせを優先しています。</div>
  </div>`;
  cmp.innerHTML='';
}



const PIECE_PALETTE = [
  {bg:'#edf2eb', border:'#7d9279'},
  {bg:'#eaf0f3', border:'#738996'},
  {bg:'#f3ecdf', border:'#a38958'},
  {bg:'#f2e8e4', border:'#9e7569'},
  {bg:'#eeebf2', border:'#83778e'},
  {bg:'#e8f0ed', border:'#6f8d82'}
];


function hexToRgba(hex, alpha){
  const h=hex.replace('#','');
  const r=parseInt(h.slice(0,2),16);
  const g=parseInt(h.slice(2,4),16);
  const b=parseInt(h.slice(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function pieceColorFor(label){
  let hash=0;
  for(let i=0;i<label.length;i++){
    hash=((hash<<5)-hash)+label.charCodeAt(i);
    hash|=0;
  }
  return PIECE_PALETTE[Math.abs(hash)%PIECE_PALETTE.length];
}

function renderSheets(sheets,pieces){
  resultEl.innerHTML='';
  resultEl.style.textAlign='left';

  sheets.forEach((s,idx)=>{
    const wrap=document.createElement('div');
    wrap.className='sheet-wrap';
    const title=document.createElement('div');
    title.className='sheet-title';
    title.textContent=`原板 ${idx+1}：${s.label}　${s.sheetW} × ${s.sheetH}`;

    const sheet=document.createElement('div');
    sheet.className='sheet';
    sheet.style.aspectRatio=`${s.sheetW}/${s.sheetH}`;

    s.items.forEach(it=>{
      const p=document.createElement('div');
      p.className='piece';
      p.style.left=`${it.x/s.sheetW*100}%`;
      p.style.top=`${it.y/s.sheetH*100}%`;
      p.style.width=`${it.w/s.sheetW*100}%`;
      p.style.height=`${it.h/s.sheetH*100}%`;
      const label=[it.drawing,it.name].filter(Boolean).join('｜');
      const pc=pieceColorFor(it.drawing || it.name || '');
      p.style.background=pc.bg;
      p.style.borderColor=pc.border;
      const cutText=`${it.w}×${it.h}${it.rotated?' ↻':''}`;
      const finishText=(it.finishW&&it.finishH)
        ? `仕上 ${it.finishW}×${it.finishH} / 木取 ${cutText}`
        : cutText;
      p.innerHTML=`<strong>${label}</strong>${finishText}`;
      sheet.appendChild(p);
    });

    wrap.append(title,sheet);
    resultEl.appendChild(wrap);
  });

  const usedArea=pieces.reduce((a,p)=>a+p.w*p.h,0);
  const totalArea=sheets.reduce((a,s)=>a+s.sheetW*s.sheetH,0);
  const rate=usedArea/totalArea*100;
  document.getElementById('sheetCount').textContent=sheets.length;
  document.getElementById('yieldRate').textContent=rate.toFixed(1)+'%';
  document.getElementById('pieceCount').textContent=pieces.length;
}

};

async function createShareImage(){
  const pieces=getPieces();
  if(!pieces.length)throw new Error('先に木取り計算してください');

  const kerf=Math.max(0,Number(document.getElementById('kerf').value));
  const margin=Math.max(0,Number(document.getElementById('margin').value));
  const types=getValidSheetTypes();
  const best=findBestSheetMix(pieces,types,kerf,margin);
  const sheets=best.sheets;

  const canvas=document.getElementById('shareCanvas');
  const ctx=canvas.getContext('2d');
  const W=1200,pad=70,headerH=220,gap=70;
  const maxRatio=Math.max(...sheets.map(s=>s.sheetH/s.sheetW));
  const drawW=W-pad*2;
  const drawHs=sheets.map(s=>drawW*(s.sheetH/s.sheetW));
  const H=headerH+drawHs.reduce((a,h)=>a+h+gap,0)+60;
  canvas.width=W;canvas.height=Math.ceil(H);

  ctx.fillStyle='#f3f1ec';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#2f312f';ctx.font='700 42px -apple-system,sans-serif';ctx.fillText('木取り表',pad,68);
  ctx.font='600 26px -apple-system,sans-serif';
  const mixText=Object.entries(best.counts).map(([k,v])=>`${k}×${v}`).join(' + ');
  ctx.fillText(`原板：${mixText}`,pad,122);
  ctx.fillText(`必要枚数：${best.sheetCount}枚`,pad,166);
  ctx.fillText(`歩留まり：${best.yieldRate.toFixed(1)}%`,pad+330,166);

  let y=headerH;
  sheets.forEach((s,index)=>{
    const drawH=drawW*(s.sheetH/s.sheetW);
    ctx.fillStyle='#2f312f';ctx.font='600 24px -apple-system,sans-serif';
    ctx.fillText(`原板 ${index+1}：${s.label} ${s.sheetW}×${s.sheetH}`,pad,y-18);
    ctx.fillStyle='#e8ddc8';ctx.fillRect(pad,y,drawW,drawH);
    ctx.strokeStyle='#665f55';ctx.lineWidth=3;ctx.strokeRect(pad,y,drawW,drawH);

    s.items.forEach(it=>{
      const x=pad+(it.x/s.sheetW)*drawW, py=y+(it.y/s.sheetH)*drawH;
      const w=(it.w/s.sheetW)*drawW,h=(it.h/s.sheetH)*drawH;
      const pc=pieceColorFor(it.drawing || it.name || '');
      ctx.fillStyle=pc.bg;ctx.fillRect(x,py,w,h);
      ctx.strokeStyle=pc.border;ctx.lineWidth=2;ctx.strokeRect(x,py,w,h);
      ctx.save();ctx.beginPath();ctx.rect(x+3,py+3,Math.max(0,w-6),Math.max(0,h-6));ctx.clip();
      ctx.fillStyle='#2b2a28';ctx.font='600 18px -apple-system,sans-serif';
      ctx.fillText([it.drawing,it.name].filter(Boolean).join('｜'),x+8,py+24);
      ctx.font='15px -apple-system,sans-serif';
      const dims=(it.finishW&&it.finishH)
        ? `仕上 ${it.finishW}×${it.finishH} / 木取 ${it.w}×${it.h}${it.rotated?' ↻':''}`
        : `${it.w}×${it.h}${it.rotated?' ↻':''}`;
      ctx.fillText(dims,x+8,py+47);
      ctx.restore();
    });
    y+=drawH+gap;
  });

  return await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('画像作成に失敗しました')),'image/png',.95));
}

function setupEnterNavigation(){
  // iPhoneなどで「次へ」と表示されやすくする
  document.querySelectorAll('input[type="number"]').forEach(input=>{
    input.setAttribute('enterkeyhint','next');
  });
}

// 数字入力欄でEnterを押したら、次の表示中・有効な数字入力欄へ移動
document.addEventListener('keydown', e=>{
  if(e.key !== 'Enter') return;
  const current = e.target;
  if(!(current instanceof HTMLInputElement)) return;
  if(current.type !== 'number') return;

  const inputs = [...document.querySelectorAll('input[type="number"]')]
    .filter(el=>{
      const style = window.getComputedStyle(el);
      return !el.disabled &&
             style.display !== 'none' &&
             style.visibility !== 'hidden' &&
             el.offsetParent !== null;
    });

  const index = inputs.indexOf(current);
  if(index < 0) return;

  e.preventDefault();

  const next = inputs[index + 1];
  if(next){
    next.focus();
    // 入力済みの数字をそのまま上書きしやすくする
    if(typeof next.select === 'function') next.select();
    next.scrollIntoView({behavior:'smooth', block:'center', inline:'nearest'});
  }else{
    current.blur();
  }
});

// 動的に追加される行・原板入力にも適用
const enterNavObserver = new MutationObserver(()=>setupEnterNavigation());
enterNavObserver.observe(document.body,{childList:true,subtree:true});
