name: Deploy v91

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-v91.yml'
      - '.github/scripts/apply_v91.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v91 patch
        run: python .github/scripts/apply_v91.py
      - name: Verify v91
        run: |
          grep -q 'data-build="ma-project-v91"' index.html
          grep -q '>棚・束</button>' index.html
          grep -q 'pointer-events:none!important' index.html
      - name: Commit v91
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Deploy v91: move inner backboard and disable illustration touch'
          git push
