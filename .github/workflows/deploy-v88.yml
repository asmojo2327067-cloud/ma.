name: Deploy v88
on:
  push:
    paths:
      - '.github/scripts/apply_v88.py'
      - '.github/workflows/deploy-v88.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v88 focused interaction update
        run: python .github/scripts/apply_v88.py
      - name: Verify v88
        run: |
          grep -q 'ma-project-v88' index.html
          grep -q 'dockContextBar' index.html
          grep -q 'contextualDockTabForPart' index.html
          grep -q 'mobileContextSheetOpen' index.html
          ! grep -q 'original Sketch Craft image buttons' index.html
          ! grep -q 'btn-normal.png' index.html
      - name: Commit v88
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Deploy v88: focused direct editing and mobile sheet'
          git push
