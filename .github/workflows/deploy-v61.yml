name: Deploy ma v61

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-v61.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify v60 baseline
        run: |
          echo "6063582036b509264f523d8b1491e130fcc892ef145ff032b4f070b76d17eff2  index.html" | sha256sum -c -
      - name: Apply v61 patch
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/v61.patch
          patch -p1 < /tmp/v61.patch
          grep -q '<title>ma.｜案件 v61</title>' index.html
          grep -q 'data-build="ma-project-v61"' index.html
          grep -q 'version:61' index.html
          echo "c864ac4ebfd5f0beb8253bf781257564696e208c3713cf5a9dce3a3e3ab2f7bf  index.html" | sha256sum -c -
      - name: Commit v61
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update ma. to v61"
          git push
