name: Deploy ma v66

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-v66.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify v65 baseline
        run: |
          echo "aad173178e34ae76ad9298e4990197ef705fd0979da0cec20494aebc3d714141  index.html" | sha256sum -c -
      - name: Apply v66 patch
        run: |
          echo '' | base64 -d | gzip -d > /tmp/v66.patch
          git apply /tmp/v66.patch
          echo "07010fc4f5d13d8ebcd830004978e0c954448b2c2af846aa2e346d81638c01f9  index.html" | sha256sum -c -
      - name: Commit v66
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update ma. to v66"
          git push
