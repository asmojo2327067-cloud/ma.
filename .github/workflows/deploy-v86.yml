name: Deploy v86
on:
  push:
    paths:
      - '.github/scripts/apply_v86.py'
      - '.github/workflows/deploy-v86.yml'
      - 'assets/btn-v86-*.svg'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v86
        run: python .github/scripts/apply_v86.py
      - name: Verify v86
        run: |
          grep -q 'ma-project-v86' index.html
          grep -q 'btn-v86-normal.svg?v=86' index.html
      - name: Commit v86
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Deploy v86: restrained Sketch Craft buttons'
          git push
