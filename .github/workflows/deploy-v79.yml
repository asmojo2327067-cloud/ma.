name: Deploy v79
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_v79.py'
      - '.github/workflows/deploy-v79.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply v79
        run: python .github/scripts/apply_v79.py
      - name: Commit v79
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Deploy v79: Sketch Craft theme'
          git push
# v79 trigger
