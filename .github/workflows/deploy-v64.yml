name: Deploy ma v64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-v64.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify v63 baseline
        run: |
          grep -q 'ma.｜案件 v63' index.html
      - name: Apply v64 patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/v64.patch
          git apply /tmp/v64.patch
          echo "a2c67ffec72fb6914cc335d1994dccb38a105d5c904d2b9a45a9ce9a5d68decc  index.html" | sha256sum -c -
      - name: Commit v64
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update ma. to v64"
          git push
