name: Deploy ma v60

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-v60.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v60 patch
        run: |
          echo '' | base64 -d | gzip -d > /tmp/v60.patch
          git apply --check /tmp/v60.patch
          git apply /tmp/v60.patch
          grep -q 'data-build="ma-project-v60"' index.html
          grep -q 'version:60' index.html
          echo '6063582036b509264f523d8b1491e130fcc892ef145ff032b4f070b76d17eff2  index.html' | sha256sum -c -
      - name: Commit v60
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update ma. to v60"
          git push
