name: Deploy ma v62

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-v62.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v62 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, subprocess
          baseline='c864ac4ebfd5f0beb8253bf781257564696e208c3713cf5a9dce3a3e3ab2f7bf'
          target='7850f3cedf17f765a13143101ebee0b47d00f07824a8a4cee5b8f6a564ea1955'
          p=Path('index.html')
          got=hashlib.sha256(p.read_bytes()).hexdigest()
          if got != baseline:
              raise SystemExit(f'Unexpected v61 baseline: {got}')
          payload=''''''
          patch=gzip.decompress(base64.b64decode(payload)).decode('utf-8')
          Path('/tmp/v62.patch').write_text(patch, encoding='utf-8')
          subprocess.run(['git','apply','/tmp/v62.patch'], check=True)
          got=hashlib.sha256(p.read_bytes()).hexdigest()
          if got != target:
              raise SystemExit(f'v62 hash mismatch: {got}')
          text=p.read_text(encoding='utf-8')
          required=['<title>ma.｜案件 v62</title>','data-build="ma-project-v62"','mobileThreeFullscreen','mobileThreeExit']
          missing=[x for x in required if x not in text]
          if missing:
              raise SystemExit(f'Missing v62 markers: {missing}')
          print('v62 verified', got)
          PY
      - name: Commit v62
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update ma. to v62"
          git push
