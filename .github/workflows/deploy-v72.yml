name: Deploy v72
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  update-v72:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v72 patch
        shell: bash
        run: |
          if grep -q 'ma-project-v72' index.html; then
            echo 'v72 already applied'
            exit 0
          fi
          echo '' | base64 -d | gzip -d > /tmp/v72.patch
          patch -p1 < /tmp/v72.patch
          grep -q 'ma-project-v72' index.html
      - name: Commit v72
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Update ma. to v72'
          git push
