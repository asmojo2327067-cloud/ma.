name: deploy-v77

on:
  push:
    paths:
      - '.github/workflows/deploy-v77.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch index to v77
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          checks=['<title>ma.｜案件 v75</title>','version:75,','data-build="ma-project-v75"','const WORKSPACE_DOCK_KEY="maWorkspaceDockV75"','>構成マスター<','</style>']
          missing=[x for x in checks if x not in s]
          if missing:
              raise SystemExit('missing expected v75 markers: '+repr(missing))
          s=s.replace('<title>ma.｜案件 v75</title>','<title>ma.｜案件 v77</title>',1)
          s=s.replace('version:75,','version:77,',1)
          s=s.replace('data-build="ma-project-v75"','data-build="ma-project-v77"',1)
          s=s.replace('const WORKSPACE_DOCK_KEY="maWorkspaceDockV75"','const WORKSPACE_DOCK_KEY="maWorkspaceDockV77"',1)
          s=s.replace('>構成マスター<','>材料構成<')
          s=s.replace('<h3>構成マスター</h3>','<h3>材料構成</h3>')
          css=base64.b64decode('').decode('utf-8')
          if '/* ===== unified tab controls / v77 ===== */' not in s:
              s=s.replace('</style>',css+'\n</style>',1)
          for marker in ['<title>ma.｜案件 v77</title>','data-build="ma-project-v77"','>材料構成<','--tab-control-h:30px']:
              if marker not in s:
                  raise SystemExit('v77 verification failed: '+marker)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit v77
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Update ma. to v77 unified tab controls'
          git push
