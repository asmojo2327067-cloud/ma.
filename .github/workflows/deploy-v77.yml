name: deploy-v77

on:
  push:
    paths:
      - '.github/workflows/deploy-v77.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch index to v77
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          checks=[
            '<title>ma.｜案件 v75</title>',
            'version:75,',
            'data-build="ma-project-v75"',
            'const WORKSPACE_DOCK_KEY="maWorkspaceDockV75"',
            '>構成マスター<',
            '</style>'
          ]
          missing=[x for x in checks if x not in s]
          if missing:
              raise SystemExit('missing expected v75 markers: '+repr(missing))

          s=s.replace('<title>ma.｜案件 v75</title>','<title>ma.｜案件 v77</title>',1)
          s=s.replace('version:75,','version:77,',1)
          s=s.replace('data-build="ma-project-v75"','data-build="ma-project-v77"',1)
          s=s.replace('const WORKSPACE_DOCK_KEY="maWorkspaceDockV75"','const WORKSPACE_DOCK_KEY="maWorkspaceDockV77"',1)
          s=s.replace('>構成マスター<','>材料構成<')
          s=s.replace('<h3>構成マスター</h3>','<h3>材料構成</h3>')

          css=r'''
/* ===== unified tab controls / v77 ===== */
:root{
  --tab-control-h:30px;
  --tab-control-radius:4px;
  --tab-control-font:9px;
  --tab-control-bg:#fff;
  --tab-control-border:var(--line);
  --tab-control-active:#32312d;
  --tab-control-active-text:#fff;
}
#workspaceDock .seg button,
#workspaceDock .edgeBtn,
#workspaceDock .toggleBtn,
#workspaceDock .innerBoxButtons button,
#workspaceDock .jointTextChoices button,
#workspaceDock .step button,
.left .seg button,
.left .edgeBtn,
.left .toggleBtn,
.left .step button,
.mobileSidebar .seg button,
.mobileSidebar .edgeBtn,
.mobileSidebar .toggleBtn,
.mobileSidebar .step button{
  min-height:var(--tab-control-h)!important;
  height:var(--tab-control-h)!important;
  border:1px solid var(--tab-control-border)!important;
  border-radius:var(--tab-control-radius)!important;
  background:var(--tab-control-bg)!important;
  color:var(--muted)!important;
  padding:5px 8px!important;
  font-size:var(--tab-control-font)!important;
  font-weight:750!important;
  line-height:1.1!important;
  box-shadow:none!important;
}
#workspaceDock .seg button.active,
#workspaceDock .edgeBtn.on,
#workspaceDock .toggleBtn.on,
#workspaceDock .innerBoxButtons button.active,
#workspaceDock .jointTextChoices button.active,
.left .seg button.active,
.left .edgeBtn.on,
.left .toggleBtn.on,
.mobileSidebar .seg button.active,
.mobileSidebar .edgeBtn.on,
.mobileSidebar .toggleBtn.on{
  background:var(--tab-control-active)!important;
  border-color:var(--tab-control-active)!important;
  color:var(--tab-control-active-text)!important;
}
#workspaceDock .addButtons button,
#workspaceDock .ghost,
.left .structureAddButton,
.mobileSidebar .structureAddButton,
#rightHistorySection .historyAddPartButton{
  min-height:var(--tab-control-h)!important;
  height:var(--tab-control-h)!important;
  border:1px solid var(--tab-control-border)!important;
  border-radius:var(--tab-control-radius)!important;
  background:var(--tab-control-bg)!important;
  color:var(--ink)!important;
  padding:5px 9px!important;
  font-size:var(--tab-control-font)!important;
  font-weight:800!important;
  line-height:1.1!important;
  box-shadow:none!important;
}
#workspaceDock .addButtons button,
.left .structureAddButton,
.mobileSidebar .structureAddButton,
#rightHistorySection .historyAddPartButton{
  background:var(--tab-control-active)!important;
  border-color:var(--tab-control-active)!important;
  color:var(--tab-control-active-text)!important;
}
#workspaceDock .ghost.danger,
#rightHistorySection .historyDeletePart{
  min-height:var(--tab-control-h)!important;
  height:var(--tab-control-h)!important;
  border:1px solid #c9aaa4!important;
  border-radius:var(--tab-control-radius)!important;
  background:#fff!important;
  color:#955b53!important;
  padding:5px 9px!important;
  font-size:var(--tab-control-font)!important;
  font-weight:800!important;
  line-height:1.1!important;
}
#workspaceDock .step button,
.left .step button,
.mobileSidebar .step button{
  padding:0!important;
  font-size:15px!important;
}
.dockSettingsPanel .seg button,
.dockSettingsPanel .edgeBtn,
.dockSettingsPanel .toggleBtn{
  min-height:var(--tab-control-h)!important;
  height:var(--tab-control-h)!important;
}
.sideTab,
.workspaceDockTabs button{
  min-height:30px;
  border-radius:4px!important;
  font-size:9.5px!important;
  font-weight:750!important;
  padding:6px 10px!important;
}
'''
          if '/* ===== unified tab controls / v77 ===== */' not in s:
              s=s.replace('</style>',css+'\n</style>',1)

          for marker in ['<title>ma.｜案件 v77</title>','data-build="ma-project-v77"','>材料構成<','--tab-control-h:30px']:
              if marker not in s:
                  raise SystemExit('v77 verification failed: '+marker)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit v77
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Update ma. to v77 unified tab controls'
          git push
