name: Deploy v67
on:
  push:
    branches: [main]
    paths: [.github/workflows/deploy-v67.yml]
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify v66 baseline
        run: |
          test "$(git hash-object index.html)" = "25010e59b6431e256ec5162e1adcb0e48fd8cf2e"
      - name: Apply v67 patch
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/v67.patch
          git apply /tmp/v67.patch
          test "$(git hash-object index.html)" = "b295236219c495c863b755fcc5b10ac437c5ed76"
          test "$(sha256sum index.html | cut -d' ' -f1)" = "9b182246fa60571491ada6a6bae9905de52bcaf23a4ee2330d84c1fcf8a91dcc"
          grep -q 'data-build="ma-project-v67"' index.html
      - name: Commit v67
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Update ma. to v67'
          git push
