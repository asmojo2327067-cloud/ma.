name: Deploy ma v65

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-v65.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify v64 baseline
        run: |
          grep -q 'data-build="ma-project-v64"' index.html
      - name: Apply v65 patch
        run: |
          echo '' | base64 -d | gzip -d > /tmp/v65.patch
          patch -p0 < /tmp/v65.patch
          echo "aad173178e34ae76ad9298e4990197ef705fd0979da0cec20494aebc3d714141  index.html" | sha256sum -c -
          grep -q 'data-build="ma-project-v65"' index.html
      - name: Commit v65
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update ma. to v65"
          git push
