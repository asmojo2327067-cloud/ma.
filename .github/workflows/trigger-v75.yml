name: Trigger v75 deploy
on:
  push:
    paths:
      - '.github/workflows/trigger-v75.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply payload from deploy-v75 workflow
        shell: bash
        run: |
          awk '/^H4s/{flag=1} flag{print} /^EOF$/{exit}' .github/workflows/deploy-v75.yml | sed '$d' > /tmp/patch.b64
          base64 -d /tmp/patch.b64 | gzip -d > /tmp/v75.patch
          patch -p1 -F3 < /tmp/v75.patch
          grep -q 'data-build="ma-project-v75"' index.html
          test "$(sha256sum index.html | awk '{print $1}')" = "1a8f3fd7b11a3f38e61b7d067d0f8d8dbf8678e26d35babe7ebfcdef25a9b171"
      - name: Commit v75
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update ma. to v75"
          git push
