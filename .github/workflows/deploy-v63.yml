name: Deploy ma v63

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-v63.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify v62 baseline
        shell: bash
        run: |
          test "$(git hash-object index.html)" = "34f9bf906b0643ee06d5f6ad1be75c45215bf93a"
          grep -q '<title>ma.｜案件 v62</title>' index.html

      - name: Apply v63 patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/v63.patch
          git apply --check /tmp/v63.patch
          git apply /tmp/v63.patch
          echo "484078c7a294c3677bf2d55884515cbb607f8e2cdabc4c0f478b32ad80d2837d  index.html" | sha256sum -c -
          grep -q '<title>ma.｜案件 v63</title>' index.html
          grep -q 'data-build="ma-project-v63"' index.html
          grep -q 'id="mobileThreeInfo"' index.html
          grep -q 'data-mobile-three-view="rightFront"' index.html
          grep -q 'data-mobile-three-view="leftFront"' index.html

      - name: Commit v63
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update ma. to v63"
          git push
